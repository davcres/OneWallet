name: Android Testing CI

on: [ push ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4 # preparar java
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create secrets.properties
        run: |
          echo "FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}" >> $GITHUB_WORKSPACE/secrets.properties
          echo "TWELVE_DATA_API_KEY=${{ secrets.TWELVE_DATA_API_KEY }}" >> $GITHUB_WORKSPACE/secrets.properties
          echo "TELEGRAM_API_KEY=${{ secrets.TELEGRAM_API_KEY }}" >> $GITHUB_WORKSPACE/secrets.properties
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> $GITHUB_WORKSPACE/secrets.properties

      - name: Unit Tests
        run: ./gradlew testDebugUnitTest # ejecuta tests

      # Recomendado: instala Android SDK + acepta licenses
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        # (opcional) with: por si una versión nueva de cmdline-tools cambia algo y da error
        #   cmdline-tools-version: 11076708

      # UI / Instrumentation tests (Compose) en emulador
      - name: Instrumentation (UI) Tests - Compose
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      # (Opcional) Sube reportes como artefactos para ver cual es el problema si fallan los tests
      - name: Upload Android Test Reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            **/build/reports/*
            **/build/outputs/androidTest-results/*

      - name: Android Tests Report
        uses: asadmansr/android-test-report-action@v1.2.0 # reporte de los tests
        if: ${{ always() }} # ejecutar siempre, aunque los tests fallen
